<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codoku</title>
<meta name="description" content="Codoku: practise data structures and algorithms in Python, one lesson a day.">
<style>
:root{color-scheme:light dark;--fg:#1c1c1e;--bg:#fff;--muted:#6e6e73;--line:#d2d2d7;--link:#4f46e5}
@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--bg:#111;--muted:#a1a1a6;--line:#3a3a3c;--link:#a5b4fc}}
html{background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;padding:24px 20px 64px}main{max-width:720px;margin:0 auto}
h1{font-size:1.9rem;line-height:1.2;margin:.4em 0}h2{font-size:1.25rem;margin:1.8em 0 .5em}
a{color:var(--link)}table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:.5em .6em;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
code{font:.92em ui-monospace,SFMono-Regular,Menlo,monospace}ol,ul{padding-left:1.4em}
footer{margin-top:3em;color:var(--muted);font-size:.9rem}
main{padding-top:12vh}p{font-size:1.15rem}</style>
</head>
<body>
<main>
<h1>Codoku</h1>
<p>Practise data structures and algorithms in Python, one lesson a day.</p>
<p><a href="/privacy">Privacy policy</a> &middot; <a href="mailto:hello@codoku.app">hello@codoku.app</a></p>
</main>
</body>
</html>
